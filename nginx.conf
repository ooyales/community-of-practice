worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    upstream backend {
        server 127.0.0.1:5000;
    }

    server {
        listen 8080;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Health check endpoint
        location /health {
            proxy_pass http://backend/api/health;
        }

        # API proxy to gunicorn
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Serve standalone HTML files directly
        location = /cop-pitch-interactive.html {
            root /app/frontend/dist;
            try_files $uri =404;
        }

        location = /cop-in-a-box-demo.html {
            root /app/frontend/dist;
            try_files $uri =404;
        }

        location = /portfolio-scenario-planner.html {
            root /app/frontend/dist;
            try_files $uri =404;
        }

        # React SPA — serve static assets, fallback to index.html
        location / {
            root /app/frontend/dist;
            try_files $uri $uri/ /index.html;
        }
    }
}
