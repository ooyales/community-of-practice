worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    upstream backend {
        server 127.0.0.1:5000;
    }

    server {
        listen 8080;

        # Health check (no auth needed)
        location /health {
            proxy_pass http://backend/api/health;
        }

        # API proxy to gunicorn
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Demo auth entry
        location /demo {
            proxy_pass http://backend/demo;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /demo-expired {
            proxy_pass http://backend/demo-expired;
            proxy_set_header Host $host;
        }

        # Standalone HTML tools and shared config (no auth needed)
        location = /cop-pitch-interactive.html {
            root /app/frontend/dist;
            try_files $uri =404;
        }

        location = /cop-in-a-box-demo.html {
            root /app/frontend/dist;
            try_files $uri =404;
        }

        location = /portfolio-scenario-planner.html {
            root /app/frontend/dist;
            try_files $uri =404;
        }

        location = /migrateiq-configurator.html {
            root /app/frontend/dist;
            try_files $uri =404;
        }

        location = /migrateiq-config.js {
            root /app/frontend/dist;
            try_files $uri =404;
        }

        # PDF one-pagers (no auth needed)
        location ~ ^/migrateiq-onepager-.+\.pdf$ {
            root /app/frontend/dist;
            try_files $uri =404;
        }

        # Old PDF (keep for backwards compat)
        location = /cop-one-pager.pdf {
            root /app/frontend/dist;
            try_files $uri =404;
        }

        # Static frontend (Vite build) — requires demo cookie
        location / {
            if ($cookie_demo_session = "") {
                return 302 /demo-expired;
            }
            root /app/frontend/dist;
            try_files $uri $uri/ /index.html;
        }
    }
}
